# Shared release workflow for the NON-RUST public mirror repos, consumed at the
# moving tag @v1 exactly like release.yml. One tier per publishable shape:
#
#   npm    — the Pulumi TypeScript packages (@mcpg/pulumi, -crds, -policy)
#   go     — terraform-provider-mcpg (Terraform Registry wants GPG-signed
#            cross-platform binaries + a SHA256SUMS file, not a container)
#   hcl    — the Terraform module (nothing to build; the Registry reads the tag)
#   chart  — the charts repo: every chart packaged and pushed to the OCI
#            registry, skipping versions the registry already has
#
# Consent gates, same shape as the Rust lane and all default-off:
#   OSS_CI_ENABLED       — anything runs at all
#   OSS_NPM_PUBLISH      — real `npm publish` (else `--dry-run`)
#   OSS_ARTIFACTS_PUBLISH— chart OCI push, provider binaries
# Secrets: NPM_TOKEN, OSS_TF_REGISTRY_GPG_KEY (+ …_PASSPHRASE).
name: Release (non-Rust)

on:
  workflow_call:
    inputs:
      tier:
        description: npm | go | hcl | chart
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  meta:
    if: vars.OSS_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: v
        env:
          TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          # The charts repo is not tag-driven, so GITHUB_REF_NAME is a branch
          # there and these two outputs go unused by that lane.
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          case "$TIER" in
            npm) name=$(jq -r .name package.json) ;;
            *)   name="${GITHUB_REPOSITORY#*/}" ;;
          esac
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "name=${name}"
          } >> "$GITHUB_OUTPUT"

  # ── npm ─────────────────────────────────────────────────────────────────────
  npm:
    if: inputs.tier == 'npm'
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install + build + test
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          # A package without tests should not invent a green one.
          if jq -e '.scripts.test' package.json >/dev/null; then npm test; fi
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          NAME: ${{ needs.meta.outputs.name }}
        run: |
          set -euo pipefail
          # The manifest is the version source, exactly as Cargo.toml is on the
          # Rust side — a tag that disagrees with it is a packaging mistake, not
          # something to paper over by rewriting the manifest here.
          manifest=$(jq -r .version package.json)
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::tag ${VERSION} does not match package.json ${manifest}"
            exit 1
          fi
          # Idempotent: a version already on the registry is success, not a
          # failure, so re-dispatching a partially-completed wave is safe.
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already published"
            exit 0
          fi
          if [ "${{ vars.OSS_NPM_PUBLISH }}" = "true" ]; then
            npm publish --provenance --access public
          else
            echo "OSS_NPM_PUBLISH is not set — dry run only"
            npm publish --dry-run --access public
          fi

  # ── go (terraform provider) ─────────────────────────────────────────────────
  go:
    if: inputs.tier == 'go'
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet + test
        run: |
          set -euo pipefail
          go vet ./...
          go build ./...
          go test ./...
      # The Terraform Registry ingests a GitHub Release carrying per-platform
      # zips, a SHA256SUMS manifest, and a detached GPG signature over that
      # manifest — it will not read cosign bundles. Without the key the binaries
      # still build and attach; the Registry simply cannot ingest them.
      - name: Build release binaries
        if: vars.OSS_ARTIFACTS_PUBLISH == 'true'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          NAME: ${{ needs.meta.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          while read -r goos goarch; do
            out="${NAME}_v${VERSION}_${goos}_${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${NAME}" .
            (cd dist && zip -q "${out}.zip" "${NAME}" && rm "${NAME}")
          done <<'PLATFORMS'
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          windows amd64
          PLATFORMS
          (cd dist && sha256sum *.zip > "${NAME}_${VERSION}_SHA256SUMS")
      - name: Sign the manifest for the Terraform Registry
        if: vars.OSS_ARTIFACTS_PUBLISH == 'true' && env.GPG_KEY != ''
        env:
          GPG_KEY: ${{ secrets.OSS_TF_REGISTRY_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.OSS_TF_REGISTRY_GPG_PASSPHRASE }}
          VERSION: ${{ needs.meta.outputs.version }}
          NAME: ${{ needs.meta.outputs.name }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_KEY" | base64 -d | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          gpg --batch --yes --pinentry-mode loopback \
            ${GPG_PASSPHRASE:+--passphrase "$GPG_PASSPHRASE"} \
            --local-user "$key" --detach-sign \
            "dist/${NAME}_${VERSION}_SHA256SUMS"
      - name: Attach to the Release
        if: vars.OSS_ARTIFACTS_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

  # ── hcl (terraform module) ──────────────────────────────────────────────────
  # Nothing is published: the Terraform Registry reads the repository's tags
  # directly. This lane exists so a tag that does not even validate never
  # becomes a Registry version.
  hcl:
    if: inputs.tier == 'hcl'
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false
      - name: fmt + validate, root and every submodule
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          # `-backend=false` so validation needs no credentials or remote state.
          for dir in . $(find modules examples -name '*.tf' -printf '%h\n' 2>/dev/null | sort -u); do
            echo "::group::validate ${dir}"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  # ── charts repo ─────────────────────────────────────────────────────────────
  # One repository, several independently-versioned charts, so there is no tag
  # to key off: the job walks every chart directory, lints and renders it, and
  # publishes the ones whose version the registry does not already have. That
  # makes it idempotent and correct when several charts move in one sync.
  chart:
    if: inputs.tier == 'chart'
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - name: Lint, render and conform every chart
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          for dir in */; do
            [ -f "${dir}Chart.yaml" ] || continue
            echo "::group::${dir%/}"
            # Subcharts travel vendored UNPACKED under charts/ — helm refuses to
            # package a chart whose subcharts are .tgz — so resolve offline.
            helm dependency build "$dir" >/dev/null 2>&1 || helm dependency list "$dir"
            helm lint "$dir" || fail=1
            helm template release "$dir" > "/tmp/${dir%/}.yaml" || fail=1
            echo "::endgroup::"
          done
          if [ ! -s /usr/local/bin/kubeconform ]; then
            curl -fsSL --retry 3 --max-time 120 \
              https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
              | tar -xz -C /usr/local/bin kubeconform
          fi
          for rendered in /tmp/*.yaml; do
            # `-ignore-missing-schemas` so a CRD-typed resource is skipped
            # rather than failing a chart whose CRDs the operator owns.
            kubeconform -summary -ignore-missing-schemas "$rendered" || fail=1
          done
          exit "$fail"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: vars.OSS_ARTIFACTS_PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the versions the registry is missing
        if: vars.OSS_ARTIFACTS_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          repo="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          published=0
          for dir in */; do
            [ -f "${dir}Chart.yaml" ] || continue
            name=$(sed -n 's/^name:[[:space:]]*//p' "${dir}Chart.yaml" | head -1)
            version=$(sed -n 's/^version:[[:space:]]*//p' "${dir}Chart.yaml" | head -1)
            if helm show chart "${repo}/${name}" --version "$version" >/dev/null 2>&1; then
              echo "${name} ${version} is already published"
              continue
            fi
            helm package "$dir" -d /tmp/pkg
            helm push "/tmp/pkg/${name}-${version}.tgz" "$repo"
            # A per-chart tag + Release is the only meaningful marker in a
            # mono-repo; the repository tag would be ambiguous across charts.
            gh release create "${name}-v${version}" \
              --title "${name} ${version}" \
              --notes "Helm chart \`${name}\` ${version}. Install: \`helm install ${name} ${repo}/${name} --version ${version}\`" \
              "/tmp/pkg/${name}-${version}.tgz" || \
              gh release upload "${name}-v${version}" "/tmp/pkg/${name}-${version}.tgz" --clobber
            published=$((published + 1))
          done
          echo "published ${published} chart(s)"
