# Shared release workflow for the Terraform-module repositories,
# consumed at @main like release.yml. Nothing is published: the
# Terraform Registry reads the repository's tags directly. This lane
# exists so a tag that does not even validate never becomes a Registry
# version.
#
# Consent gate, default-off: OSS_CI_ENABLED.
name: Release (hcl)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  meta:
    if: vars.OSS_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: v
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) tag="${GITHUB_REF_NAME}" ;;
            *)           tag="v$(tr -d '[:space:]' < VERSION)" ;;
          esac
          {
            echo "version=${tag#v}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

  hcl:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false
      - name: fmt + validate, root and every submodule
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          # `-backend=false` so validation needs no credentials or remote state.
          for dir in . $(find modules examples -name '*.tf' -printf '%h\n' 2>/dev/null | sort -u); do
            echo "::group::validate ${dir}"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
