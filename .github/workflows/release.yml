# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  OSS RELEASE — shared reusable workflow for every mcpg-dev public repo   ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║  Called by the tiny per-repo release.yml shim on the `v{version}`        ║
# ║  release tag. Tiers:                                                     ║
# ║                                                                          ║
# ║    lib      GitHub Release + transparency assets (lock/SBOM/API diff)   ║
# ║    plugin   + 6-lane cdylib build → signed zips as release assets        ║
# ║    product  + 6-lane binary tarballs (+ companion bins) → cosign         ║
# ║             bundles + provenance attestations + SBOM (+ container        ║
# ║             image when the repo carries a Dockerfile)                    ║
# ║                                                                          ║
# ║  Crates are consumed by GIT REFERENCE (git + tag in the manifest), not   ║
# ║  crates.io — the release tag IS the publish. This workflow cuts the      ║
# ║  Release record and artifacts around it.                                 ║
# ║                                                                          ║
# ║  CONSENT GATES (org variables) — each phase ungated separately:          ║
# ║    OSS_CI_ENABLED       run anything at all (unset ⇒ instant skip)       ║
# ║    OSS_RELEASES_PUBLISH cut real GitHub Releases (else verify-only)      ║
# ║    OSS_ARTIFACTS_PUBLISH binaries/zips/images (products+plugins)         ║
# ║  Plus the tag itself, which the release pipeline pushes deliberately.    ║
# ║                                                                          ║
# ║  No Cargo.lock ships with the source, so one `lockfile` job resolves     ║
# ║  once and every lane builds `--locked` against that artifact — the       ║
# ║  same file attached to the Release. Builds are default-features:         ║
# ║  public artifacts are the community edition; enterprise artifacts        ║
# ║  ship through their own channel.                                         ║
# ╚══════════════════════════════════════════════════════════════════════════╝

name: OSS Release

on:
  workflow_call:
    inputs:
      tier:
        description: "lib | plugin | product"
        required: true
        type: string
      plugin_short:
        description: "Plugin short name (plugin tier), e.g. backend-mock"
        required: false
        type: string
        default: ""
      has_image:
        description: "Build + push the repo Dockerfile as a multi-arch image (product tier)"
        required: false
        type: boolean
        default: false
      release_features:
        description: "Comma-separated Cargo features the shipped binary is built with (product tier)"
        required: false
        type: string
        default: ""
      skip_platforms:
        description: "Comma-separated <os>-<arch> lanes this plugin cannot ship (native-dep platform gaps, e.g. windows-amd64,linux-musl-amd64)"
        required: false
        type: string
        default: ""
      extra_images:
        description: "Variant images from the same Dockerfile: comma-separated <build target>=<package name> pairs (product tier, e.g. tui=mcpg-inspector-tui)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  # System git for dependency fetches; sibling repositories are public, so
  # the fetches are anonymous.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # ── resolve name/version/tag once; decide gating ─────────────────────
  # Master CI switch: with OSS_CI_ENABLED unset, meta skips and every
  # downstream job cascade-skips — pushes during the private trial
  # execute nothing.
  meta:
    if: vars.OSS_CI_ENABLED == 'true'
    runs-on: ${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}
    outputs:
      crate: ${{ steps.m.outputs.crate }}
      version: ${{ steps.m.outputs.version }}
      tag: ${{ steps.m.outputs.tag }}
      publish: ${{ steps.m.outputs.publish }}
      wasm: ${{ steps.m.outputs.wasm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: m
        run: |
          set -euo pipefail
          crate=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['name'])")
          version=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          # Tag-push runs use the pushed tag; dispatch runs derive it from
          # the manifest so re-runs target the right release.
          case "${GITHUB_REF}" in
            refs/tags/*) tag="${GITHUB_REF_NAME}" ;;
            *)           tag="v${version}" ;;
          esac
          echo "crate=${crate}"      >> "$GITHUB_OUTPUT"
          echo "version=${version}"  >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"          >> "$GITHUB_OUTPUT"
          echo "publish=${{ vars.OSS_RELEASES_PUBLISH == 'true' }}" >> "$GITHUB_OUTPUT"
          # WASI plugins take the wasm artifact lane instead of the native
          # matrix: one wasm32-wasip2 component, published at
          # <version>-wasi-wasm — the suffix the gateway resolver falls
          # back to when no native artifact matches its platform.
          wasm=false
          if [ -f plugin.yaml ]; then
            runtime=$(sed -n 's/^runtime:[[:space:]]*//p' plugin.yaml | head -1 | tr -d '"'"'"' ')
            case "$runtime" in wasi*|wasm*) wasm=true ;; esac
          fi
          echo "wasm=${wasm}" >> "$GITHUB_OUTPUT"

  # ── verify: the crate builds, tests, and packages standalone (all tiers) ──
  # There is no registry publish: the release tag is what consumers
  # reference (`{ git = "…", tag = "v…" }`), so this job is the release's
  # correctness gate — and the entire run when Releases are still gated off.
  verify:
    needs: [meta, lockfile]
    runs-on: ${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Private mirrors consume PRIVATE sibling repos by git reference, where
      # anonymous fetches 404. The credential is the org App, MINTED per job
      # (installation tokens live an hour; cargo fetches happen at job start)
      # — one org credential instead of a standing PAT, by deliberate choice.
      # A static OSS_SIBLING_FETCH_TOKEN remains the fallback. Public repos
      # define none of these and their fetches stay anonymous.
      - name: Mint sibling-fetch token (org App)
        id: fetch-token
        if: vars.OPERATOR_GITHUB_APPLICATION_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.OPERATOR_GITHUB_APPLICATION_ID }}
          private-key: ${{ secrets.OPERATOR_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Dependency access (private sibling mirrors)
        env:
          SIBLING_FETCH_TOKEN: ${{ steps.fetch-token.outputs.token || secrets.OSS_SIBLING_FETCH_TOKEN }}
        run: |
          if [ -n "${SIBLING_FETCH_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${SIBLING_FETCH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/".insteadOf "https://github.com/${GITHUB_REPOSITORY_OWNER}/"
            echo "sibling fetch auth configured"
          else
            echo "no sibling fetch token — fetches stay anonymous"
          fi
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cargo-lock
      - name: System build dependencies
        # Some crates' build graphs need system tooling the runner image
        # lacks: protoc (proto-compiling dependencies) and the MIT Kerberos
        # headers (libgssapi-sys). Cheap enough to install everywhere.
        run: |
          sudo apt-get install -y -qq protobuf-compiler libkrb5-dev \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libkrb5-dev; }
      - name: Build + test
        # --all-targets: dev-dependency features join the resolve, which some
        # libraries require by convention (k8s-openapi-style version features
        # live in dev-dependencies; the consumer picks one).
        run: |
          set -euo pipefail
          # Same dependency set as every other lane, so a green check here means
          # the tag consumers reference resolves the way the artifacts were built.
          cargo build --locked --all-targets
          cargo test --locked
      - name: Manifest hygiene
        # `cargo package` cannot apply here: packaging strips git references
        # and re-resolves the version pins against crates.io, where sibling
        # crates deliberately do not exist — crates are consumed by git
        # reference. The standalone-parse check below is what packaging
        # would have validated about the manifest itself.
        run: cargo metadata --no-deps --format-version 1 > /dev/null

  # ── GitHub Release shell (all tiers; artifact jobs attach into it) ───
  github-release:
    # A Release is a published artefact, so the rehearsal phase
    # (OSS_RELEASES_PUBLISH unset ⇒ verify-only) must not cut real
    # Releases on every push.
    #
    # Created as a DRAFT — invisible, no notification — and flipped public by
    # the finalize job once every asset lane has run, so watchers get one
    # complete release and "latest" never points at a record whose assets are
    # still building. Plain `gh api` rather than an action: drafts are not
    # addressable by tag, so idempotent re-runs need the any-state list
    # lookup an action does not do.
    if: needs.meta.outputs.publish == 'true'
    needs: [meta, verify]
    runs-on: ${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}
    outputs:
      release_id: ${{ steps.rel.outputs.release_id }}
    steps:
      - name: Write the release body
        run: |
          cat > "$RUNNER_TEMP/body.md" <<'BODY'
          Release of `${{ needs.meta.outputs.crate }}` at `${{ needs.meta.outputs.tag }}`.
          Issues are welcome; pull requests cannot be merged here — development happens upstream.

          This crate is consumed by **git reference** — it is not published to crates.io:

          ```toml
          [dependencies]
          ${{ needs.meta.outputs.crate }} = { git = "https://github.com/${{ github.repository }}", tag = "${{ needs.meta.outputs.tag }}" }
          ```

          (binaries: `cargo install --git https://github.com/${{ github.repository }} --tag ${{ needs.meta.outputs.tag }} ${{ needs.meta.outputs.crate }}`, or use the packed assets below)

          Every asset is signed with [cosign](https://docs.sigstore.dev/) (keyless, Sigstore transparency log);
          public releases also carry a SLSA build-provenance attestation. Verify one with:

          ```
          gh attestation verify <file> --repo ${{ github.repository }}
          ```

          A resolved `Cargo.lock` and an SPDX SBOM are attached. Every lane built `--locked` against that exact
          lockfile, so it describes these binaries rather than a later resolution — to rebuild this version
          byte-for-byte, drop it in as `Cargo.lock` and build `--locked`.
          Library and plugin releases also carry a `cargo-public-api` diff of the public Rust surface against the
          previous release tag — these releases do not ship a changelog, and that diff is the machine-checkable
          answer to what changed.

          **macOS:** the `aarch64-apple-darwin` binaries are signed by cosign but are **not** Apple-codesigned or
          notarised, so Gatekeeper quarantines them on download and reports the binary as damaged. That is a policy
          decision by macOS, not a corrupt artifact — verify the cosign signature, then clear the quarantine flag:

          ```
          xattr -d com.apple.quarantine ./<binary>
          ```
          BODY
      - id: rel
        name: Find-or-create the draft record
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          # Release tags carry the version verbatim, so any `-` means
          # prerelease — beta/alpha releases must be flagged as such.
          PRE: ${{ contains(needs.meta.outputs.version, '-') }}
        run: |
          set -euo pipefail
          # Any-state lookup: a draft from an earlier attempt exists only in
          # the paginated list, never behind the by-tag endpoint. On an HTTP
          # error gh prints the raw response body to stdout with the jq
          # filter unapplied, so only a purely numeric capture counts.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id 2>/dev/null || true)
          case "$id" in ''|*[!0-9]*) id="" ;; esac
          if [ -z "$id" ]; then
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"${TAG}\")][0].id // empty" 2>/dev/null || true)
            case "$id" in ''|*[!0-9]*) id="" ;; esac
          fi
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" -f name="$TAG" \
              -F draft=true -F prerelease="$PRE" \
              -F body=@"$RUNNER_TEMP/body.md" --jq .id)
            echo "created draft release ${TAG} (id ${id})"
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" \
              -F body=@"$RUNNER_TEMP/body.md" > /dev/null
            echo "reusing release ${TAG} (id ${id}) — body refreshed"
          fi
          echo "release_id=${id}" >> "$GITHUB_OUTPUT"

  # ── finalize: the draft becomes the release ──────────────────────────
  finalize:
    # Runs after every asset lane has had its say, and deliberately also when
    # one failed or was skipped (`!cancelled()`): a red lane must not keep
    # the release hidden — it publishes with whatever attached, exactly as a
    # release created live used to behave. "Latest" is taken here for
    # non-prereleases: each repository is one project, so the per-repo
    # badge is meaningful for every repo.
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.meta.outputs.publish == 'true' && needs.github-release.result == 'success' }}
    needs: [meta, github-release, binaries, plugin-artifacts, image-manifest, public-api-diff, sbom]
    runs-on: ${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}
    steps:
      - name: Publish the record
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ needs.github-release.outputs.release_id }}
          LATEST: ${{ contains(needs.meta.outputs.version, '-') && 'false' || 'true' }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RID}" \
            -F draft=false -f make_latest="$LATEST" --jq .html_url

  # ── one dependency set for the whole release ────────────────────────────────
  # No lockfile ships with the source, so a public build resolves dependencies
  # itself. That is fine, but it must happen ONCE: resolving separately per
  # lane produced six binaries that could each have a different dependency
  # graph, and a "resolved lockfile" published from a seventh job that
  # described none of them.
  #
  # A lockfile committed in this repository wins — the release pipeline never
  # overwrites it — which is how a tag becomes reproducible rather than merely
  # self-consistent.
  lockfile:
    needs: meta
    runs-on: ${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Mint sibling-fetch token (org App)
        id: fetch-token
        if: vars.OPERATOR_GITHUB_APPLICATION_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.OPERATOR_GITHUB_APPLICATION_ID }}
          private-key: ${{ secrets.OPERATOR_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Dependency access (private sibling mirrors)
        env:
          SIBLING_FETCH_TOKEN: ${{ steps.fetch-token.outputs.token || secrets.OSS_SIBLING_FETCH_TOKEN }}
        run: |
          if [ -n "${SIBLING_FETCH_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${SIBLING_FETCH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/".insteadOf "https://github.com/${GITHUB_REPOSITORY_OWNER}/"
          fi
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
      - name: Resolve once
        run: |
          set -euo pipefail
          if [ -f Cargo.lock ]; then
            echo "using the lockfile committed in this repository"
          else
            echo "no committed lockfile — resolving now, and every lane will build against this one"
            cargo generate-lockfile
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cargo-lock
          path: Cargo.lock
          retention-days: 7

  # ── product binaries: 6 lanes, packed + signed + attested ────────────
  binaries:
    if: inputs.tier == 'product' && needs.meta.outputs.publish == 'true' && vars.OSS_ARTIFACTS_PUBLISH == 'true'
    needs: [meta, verify, github-release, lockfile]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: "${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}", triple: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu }
          - { os: "${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}", triple: x86_64-unknown-linux-musl,  musl: x86_64,
              musl_sha256: c5d410d9f82a4f24c549fe5d24f988f85b2679b452413a9f7e5f7b956f2fe7ea }
          # x86_64 host on purpose: the musl.cc cross toolchains are
          # x86_64-hosted for BOTH targets, so this lane cross-compiles.
          - { os: "${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}", triple: aarch64-unknown-linux-musl, musl: aarch64,
              musl_sha256: c909817856d6ceda86aa510894fa3527eac7989f0ef6e87b5721c58737a06c38 }
          # Hosted on purpose, even for private repos: darwin has no
          # self-hosted lane (the M1 is repo-scoped to the monorepo), and
          # the gnu-arm lane compiles natively on arm hosts. Both consume
          # paid minutes for private repos; images never depend on them.
          - { os: macos-14,        triple: aarch64-apple-darwin }
          - { os: "${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}", triple: x86_64-pc-windows-gnu,      mingw: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Mint sibling-fetch token (org App)
        id: fetch-token
        if: vars.OPERATOR_GITHUB_APPLICATION_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.OPERATOR_GITHUB_APPLICATION_ID }}
          private-key: ${{ secrets.OPERATOR_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Dependency access (private sibling mirrors)
        env:
          SIBLING_FETCH_TOKEN: ${{ steps.fetch-token.outputs.token || secrets.OSS_SIBLING_FETCH_TOKEN }}
        run: |
          if [ -n "${SIBLING_FETCH_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${SIBLING_FETCH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/".insteadOf "https://github.com/${GITHUB_REPOSITORY_OWNER}/"
          fi
      # The one resolved lockfile every lane builds against (--locked).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cargo-lock
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: ${{ matrix.triple }}
      - name: System build dependencies
        # protoc + Kerberos headers for crates whose build graphs need them;
        # per-OS, best-effort on the best-effort lanes.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y -qq protobuf-compiler libkrb5-dev \
              || { sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libkrb5-dev; }
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install protobuf krb5 || true
          fi
      - name: musl cross toolchain (dynamic linking — the gateway dlopens plugins)
        if: matrix.musl
        run: |
          set -euo pipefail
          # Mirror-first: every repository in the fleet runs this workflow,
          # so releases must not hinge on one third-party host being up
          # (musl.cc also serves unversioned URLs and rebuilds in place).
          for base in \
            "https://github.com/mcpg-dev/toolchains/releases/download/musl-cross-20260813" \
            "https://musl.cc"; do
            if curl -fsSLo /tmp/musl.tgz --retry 3 --retry-all-errors --max-time 600 \
              "$base/${{ matrix.musl }}-linux-musl-cross.tgz"; then
              break
            fi
            echo "::warning::${base} did not serve the toolchain; trying the next source"
          done
          [ -s /tmp/musl.tgz ] || { echo "::error::no source served the ${{ matrix.musl }} toolchain"; exit 1; }
          # The digest guards whichever source answered: a mismatch means the
          # tarball changed and must be re-pinned deliberately, not absorbed
          # silently into a signed release artifact.
          echo "${{ matrix.musl_sha256 }}  /tmp/musl.tgz" > /tmp/musl.sha256
          if ! sha256sum -c /tmp/musl.sha256; then
            echo "::error::${{ matrix.musl }} toolchain digest mismatch."
            echo "Re-pin matrix.musl_sha256 after reviewing the new tarball."
            exit 1
          fi
          tar -C /opt -xzf /tmp/musl.tgz
          echo "/opt/${{ matrix.musl }}-linux-musl-cross/bin" >> "$GITHUB_PATH"
          tr 'a-z-' 'A-Z_' <<< "CARGO_TARGET_${{ matrix.triple }}_LINKER" | \
            xargs -I{} echo "{}=${{ matrix.musl }}-linux-musl-gcc" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C target-feature=-crt-static" >> "$GITHUB_ENV"
      - name: mingw cross toolchain
        if: matrix.mingw
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mingw-w64 nasm
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cargo-lock
      - name: Build
        env:
          FEATURES: ${{ inputs.release_features }}
        run: |
          set -euo pipefail
          # --locked: build exactly the dependency set this release resolved and
          # publishes, so the attached lockfile describes these binaries.
          cargo build --release --locked --bins --target ${{ matrix.triple }} \
            ${FEATURES:+--features "$FEATURES"}
      - name: Pack + upload + sign + attest
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE: ${{ needs.meta.outputs.crate }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          outdir="target/${TRIPLE}/release"
          staged=$(mktemp -d)
          assets=()
          # Every [[bin]] the crate produces (companion bins included) ships
          # as its own artifact, named exactly like the private CD tarballs.
          for bin in $(python3 -c "
          import tomllib,glob,os
          m=tomllib.load(open('Cargo.toml','rb'))
          bins=[b['name'] for b in m.get('bin',[])]
          print(' '.join(bins) if bins else m['package']['name'])"); do
            case "$TRIPLE" in *windows*) exe="${bin}.exe";; *) exe="$bin";; esac
            [ -f "${outdir}/${exe}" ] || { echo "missing ${outdir}/${exe}"; exit 1; }
            stage="${staged}/${bin}-${VERSION}-${TRIPLE}"
            mkdir -p "$stage"
            cp "${outdir}/${exe}" "$stage/"
            for extra in LICENSE README.md NOTICE config.example.yaml; do
              [ -f "$extra" ] && cp "$extra" "$stage/" || true
            done
            case "$TRIPLE" in
              *windows*) archive="${bin}-${VERSION}-${TRIPLE}.zip"
                         (cd "$staged" && zip -qr "$archive" "$(basename "$stage")") ;;
              *)         archive="${bin}-${VERSION}-${TRIPLE}.tar.xz"
                         tar -C "$staged" -cJf "${staged}/${archive}" "$(basename "$stage")" ;;
            esac
            (cd "$staged" && shasum -a 256 "$archive" > "${archive}.sha256")
            assets+=("${staged}/${archive}" "${staged}/${archive}.sha256")
          done
          gh release upload "$TAG" "${assets[@]}" --clobber
          echo "STAGED=$staged" >> "$GITHUB_ENV"
      # cosign v2.x pinned: shipped verifiers (operator sigstore-rs) read the
      # legacy bundle/tag formats; do not bump to v3.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3.9.1
        with:
          cosign-release: 'v2.4.1'
      - name: Cosign bundles
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          for f in "$STAGED"/*.tar.xz "$STAGED"/*.zip; do
            [ -e "$f" ] || continue
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
            gh release upload "$TAG" "${f}.sigstore.json" --clobber
          done
      # Attestations are unavailable on private repos under this org's plan —
      # persisting one fails the whole job. Cosign bundles above cover the
      # signature need either way; public repos still attest.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-path: |
            ${{ env.STAGED }}/*.tar.xz
            ${{ env.STAGED }}/*.zip

  # ── plugin cdylibs: packed via mcpg-plugin, signed, attached ─────────
  # Compute the artifact legs, minus the lanes this plugin DECLARES it
  # cannot ship (GSSAPI on windows, a native dep absent for musl). A
  # dropped leg is visibly absent from the run; anything undeclared that
  # fails still fails the release. Job-level `if` cannot see `matrix`,
  # so the filter must happen before expansion.
  plugin-matrix:
    if: inputs.tier == 'plugin' && needs.meta.outputs.publish == 'true' && vars.OSS_ARTIFACTS_PUBLISH == 'true' && needs.meta.outputs.wasm != 'true'
    needs: meta
    runs-on: ${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - id: m
        env:
          SKIP: ${{ inputs.skip_platforms }}
        run: |
          set -euo pipefail
          jq -cn --arg skip "$SKIP" '
            [
              {os:"ubuntu-latest",    triple:"x86_64-unknown-linux-gnu",   pos:"linux",   parch:"amd64",
               build_container:"rust:1-bookworm"},
              {os:"ubuntu-24.04-arm", triple:"aarch64-unknown-linux-gnu",  pos:"linux",   parch:"arm64",
               build_container:"rust:1-bookworm"},
              {os:"ubuntu-latest",    triple:"x86_64-unknown-linux-musl",  pos:"linux",   parch:"musl-amd64", musl:"x86_64",
               musl_sha256:"c5d410d9f82a4f24c549fe5d24f988f85b2679b452413a9f7e5f7b956f2fe7ea"},
              {os:"ubuntu-latest",    triple:"aarch64-unknown-linux-musl", pos:"linux",   parch:"musl-arm64", musl:"aarch64",
               musl_sha256:"c909817856d6ceda86aa510894fa3527eac7989f0ef6e87b5721c58737a06c38"},
              {os:"macos-14",         triple:"aarch64-apple-darwin",       pos:"darwin",  parch:"arm64"},
              {os:"ubuntu-latest",    triple:"x86_64-pc-windows-gnu",      pos:"windows", parch:"amd64", mingw:true}
            ]
            | map(select((.pos + "-" + .parch) as $lane | ($skip | split(",") | index($lane)) == null))
          ' | { read -r inc; echo "include=$inc" >> "$GITHUB_OUTPUT"; }
      - name: Every lane excluded is a configuration mistake
        if: steps.m.outputs.include == '[]'
        run: |
          echo "::error::skip_platforms excludes every lane"
          exit 1

  plugin-artifacts:
    if: inputs.tier == 'plugin' && needs.meta.outputs.publish == 'true' && vars.OSS_ARTIFACTS_PUBLISH == 'true' && needs.meta.outputs.wasm != 'true'
    needs: [meta, verify, github-release, lockfile, plugin-matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plugin-matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    # Every leg counts: a green run must mean every published platform
    # built, packed, and pushed. A plugin that cannot ship a platform says
    # so explicitly (a matrix exclusion), never by a swallowed failure.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Mint sibling-fetch token (org App)
        id: fetch-token
        if: vars.OPERATOR_GITHUB_APPLICATION_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.OPERATOR_GITHUB_APPLICATION_ID }}
          private-key: ${{ secrets.OPERATOR_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Dependency access (private sibling mirrors)
        env:
          SIBLING_FETCH_TOKEN: ${{ steps.fetch-token.outputs.token || secrets.OSS_SIBLING_FETCH_TOKEN }}
        run: |
          if [ -n "${SIBLING_FETCH_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${SIBLING_FETCH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/".insteadOf "https://github.com/${GITHUB_REPOSITORY_OWNER}/"
          fi
      # The one resolved lockfile every lane builds against (--locked).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cargo-lock
      # A WASI plugin belongs in plugin-wasm-artifacts, and meta routes it
      # there — reaching this matrix means the two disagree on the manifest.
      # Building it natively here would ship a .so whose exports are the
      # wit-bindgen symbols, an artifact no gateway can load.
      - name: Native lane refuses a WASI manifest
        run: |
          set -euo pipefail
          runtime=$(sed -n 's/^runtime:[[:space:]]*//p' plugin.yaml | head -1 | tr -d '"'"'"' ')
          case "${runtime:-native}" in
            wasi*|wasm*)
              echo "::error::${GITHUB_REPOSITORY} declares runtime '${runtime}' but reached the native matrix — meta's wasm detection disagrees with this guard."
              exit 1
              ;;
          esac
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: ${{ matrix.triple }}
      - name: System build dependencies
        # protoc + Kerberos headers for crates whose build graphs need them;
        # per-OS, best-effort on the best-effort lanes.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y -qq protobuf-compiler libkrb5-dev \
              || { sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libkrb5-dev; }
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install protobuf krb5 || true
          fi
      - name: musl cross toolchain
        if: matrix.musl
        run: |
          set -euo pipefail
          # Mirror-first: every repository in the fleet runs this workflow,
          # so releases must not hinge on one third-party host being up
          # (musl.cc also serves unversioned URLs and rebuilds in place).
          for base in \
            "https://github.com/mcpg-dev/toolchains/releases/download/musl-cross-20260813" \
            "https://musl.cc"; do
            if curl -fsSLo /tmp/musl.tgz --retry 3 --retry-all-errors --max-time 600 \
              "$base/${{ matrix.musl }}-linux-musl-cross.tgz"; then
              break
            fi
            echo "::warning::${base} did not serve the toolchain; trying the next source"
          done
          [ -s /tmp/musl.tgz ] || { echo "::error::no source served the ${{ matrix.musl }} toolchain"; exit 1; }
          # The digest guards whichever source answered: a mismatch means the
          # tarball changed and must be re-pinned deliberately, not absorbed
          # silently into a signed release artifact.
          echo "${{ matrix.musl_sha256 }}  /tmp/musl.tgz" > /tmp/musl.sha256
          if ! sha256sum -c /tmp/musl.sha256; then
            echo "::error::${{ matrix.musl }} toolchain digest mismatch."
            echo "Re-pin matrix.musl_sha256 after reviewing the new tarball."
            exit 1
          fi
          tar -C /opt -xzf /tmp/musl.tgz
          echo "/opt/${{ matrix.musl }}-linux-musl-cross/bin" >> "$GITHUB_PATH"
          tr 'a-z-' 'A-Z_' <<< "CARGO_TARGET_${{ matrix.triple }}_LINKER" | \
            xargs -I{} echo "{}=${{ matrix.musl }}-linux-musl-gcc" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C target-feature=-crt-static" >> "$GITHUB_ENV"
      - name: mingw cross toolchain
        if: matrix.mingw
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mingw-w64 nasm cmake
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc" >> "$GITHUB_ENV"
      - name: Build cdylib
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.build_container || '' }}" ]; then
            # linux-gnu links against the build host's glibc, and the runner
            # image is newer than the bookworm base every published gateway
            # image runs — a host build dlopen-fails there. Build inside the
            # SAME base so the symbol floor matches by construction.
            docker run --rm -v "$PWD":/src -w /src "${{ matrix.build_container }}" \
              sh -c "apt-get update -qq && apt-get install -y -qq protobuf-compiler libkrb5-dev pkg-config \
                       cmake clang libclang-dev libxml2-dev libsasl2-dev libssl-dev zlib1g-dev \
                     && cargo build --release --locked --lib --target ${{ matrix.triple }} --features cdylib-export"
            # The container runs as root, so on a cold cache it CREATES
            # target/ root-owned — and the later host-side signing step
            # cannot write the .sig next to the artifact. Hand the tree
            # back to the runner user. (A warm rust-cache restore masks
            # this by pre-creating the directories runner-owned.)
            sudo chown -R "$(id -u):$(id -g)" target
          else
            cargo build --release --locked --lib --target ${{ matrix.triple }} --features cdylib-export
          fi
      - name: Enforce the artifact contract
        env:
          CRATE: ${{ needs.meta.outputs.crate }}
          TRIPLE: ${{ matrix.triple }}
          POS: ${{ matrix.pos }}
        run: |
          set -euo pipefail
          crate_us=$(echo "$CRATE" | tr '-' '_')
          case "$POS" in
            windows) lib="target/${TRIPLE}/release/${crate_us}.dll" ;;
            darwin)  lib="target/${TRIPLE}/release/lib${crate_us}.dylib" ;;
            *)       lib="target/${TRIPLE}/release/lib${crate_us}.so" ;;
          esac
          [ -f "$lib" ] || { echo "missing $lib"; exit 1; }
          # Entry symbols the host resolves at load. A cdylib built without
          # `cdylib-export` compiles and packs cleanly and then fails at
          # dlopen in production — the one place this must be caught is here.
          # PE exports live in the export TABLE, which objdump -p prints and
          # nm does not — reading COFF symbols passes a correct dll to the
          # wrong verdict. ELF and Mach-O read their dynamic tables.
          case "$POS" in
            windows) exports=$(x86_64-w64-mingw32-objdump -p "$lib") ;;
            darwin)  exports=$(nm -gU "$lib") ;;
            *)       exports=$(nm -D "$lib") ;;
          esac
          for sym in mcpg_plugin_register mcpg_plugin_abi_layout; do
            case "$exports" in
              *"$sym"*) : ;;
              *)
                echo "::error::$lib does not export $sym — the gateway refuses it at load. The cdylib must build with --features cdylib-export."
                exit 1
                ;;
            esac
          done
          case "$TRIPLE" in
            *linux-gnu)
              floor="2.36"
              max=$(objdump -T "$lib" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1 || true)
              max="${max#GLIBC_}"
              if [ -n "$max" ] && [ "$(printf '%s\n%s\n' "$max" "$floor" | sort -V | tail -1)" != "$floor" ]; then
                echo "::error::$lib requires GLIBC_$max, above the $floor floor — it would fail dlopen inside every published (bookworm-based) gateway image."
                exit 1
              fi
              echo "glibc floor ok: max required ${max:-none} <= $floor"
              ;;
          esac
          echo "artifact contract ok"
      - name: Install mcpg-plugin CLI (from its repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Newest release tag of the CLI's own repository; falls back to
          # its main head (== the latest release) before any Release
          # exists there.
          src="https://github.com/${{ github.repository_owner }}/mcpg-plugin"
          tag=$(gh api "repos/${{ github.repository_owner }}/mcpg-plugin/releases?per_page=1" \
            --jq '.[0].tag_name // empty' 2>/dev/null || true)
          for attempt in 1 2 3; do
            if cargo install mcpg-plugin --git "$src" ${tag:+--tag "$tag"} --locked \
               || cargo install mcpg-plugin --git "$src" ${tag:+--tag "$tag"}; then
              exit 0
            fi
            sleep $(( attempt * 30 ))
          done
          echo "::error::could not install mcpg-plugin from ${src} ${tag:+@ ${tag}}"
          exit 1
      - name: Pack, sign, upload
        env:
          GH_TOKEN: ${{ github.token }}
          # Dedicated OSS signing key — never a shared production key.
          # Absent ⇒ packaged unsigned (cosign bundle still proves
          # origin).
          MCPG_PLUGIN_SIGNING_KEY: ${{ secrets.OSS_PLUGIN_SIGNING_KEY }}
          CRATE: ${{ needs.meta.outputs.crate }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          SHORT: ${{ inputs.plugin_short }}
          TRIPLE: ${{ matrix.triple }}
          POS: ${{ matrix.pos }}
          PARCH: ${{ matrix.parch }}
        run: |
          set -euo pipefail
          crate_us=$(echo "$CRATE" | tr '-' '_')
          outdir="target/${TRIPLE}/release"
          case "$POS" in
            windows) lib="${outdir}/${crate_us}.dll" ;;
            darwin)  lib="${outdir}/lib${crate_us}.dylib" ;;
            *)       lib="${outdir}/lib${crate_us}.so" ;;
          esac
          [ -f "$lib" ] || { echo "missing $lib"; exit 1; }
          sign_args=()
          if [ -n "${MCPG_PLUGIN_SIGNING_KEY:-}" ]; then
            keyfile=$(mktemp)
            printf '%s' "$MCPG_PLUGIN_SIGNING_KEY" | base64 -d > "$keyfile"
            mcpg-plugin sign --key "$keyfile" "$lib"
            rm -f "$keyfile"
            # pack embeds only what it is handed — an unreferenced .sig next
            # to the artifact would ship nothing.
            sign_args=(--signature "${lib}.sig")
          else
            echo "::warning::OSS_PLUGIN_SIGNING_KEY unset — packaging without embedded Ed25519 signature"
          fi
          zip_name="mcpg-plugin-${SHORT}_${VERSION}_${POS}_${PARCH}.zip"
          mcpg-plugin pack --descriptor plugin.yaml --artifact "$lib" "${sign_args[@]}" \
            --version "$VERSION" --os "$POS" --arch "$PARCH" --output "$zip_name" \
            --emit-config plugin-artifact-config.json
          shasum -a 256 "$zip_name" > "${zip_name}.sha256"
          gh release upload "$TAG" "$zip_name" "${zip_name}.sha256" --clobber
          echo "ZIP=$zip_name" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3.9.1
        with:
          cosign-release: 'v2.4.1'
      - name: Cosign bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          cosign sign-blob --yes --bundle "${ZIP}.sigstore.json" "$ZIP"
          gh release upload "$TAG" "${ZIP}.sigstore.json" --clobber
      # Attestations are unavailable on private repos under this org's plan —
      # persisting one fails the whole job. Cosign bundles above cover the
      # signature need either way; public repos still attest.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-path: ${{ env.ZIP }}
      # The gateway consumes plugins by OCI reference and derives the
      # platform suffix itself, so each leg publishes its own zip as an
      # OCI artifact at <version>-<os>-<arch>. One layer, located by
      # media type on the pull side.
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1
      - name: Publish OCI artifact
        # oras carries its own login — docker/login-action shells out to a
        # docker CLI the macOS runners do not have.
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SHORT: ${{ inputs.plugin_short }}
          POS: ${{ matrix.pos }}
          PARCH: ${{ matrix.parch }}
        run: |
          set -euo pipefail
          printf '%s' "${{ github.token }}" | \
            oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          ref="ghcr.io/${{ github.repository_owner }}/plugins/${SHORT}:${VERSION}-${POS}-${PARCH}"
          echo "pushing $ref"
          oras push "$ref" \
            --artifact-type "application/vnd.mcpg.plugin.v1" \
            --config plugin-artifact-config.json:application/vnd.mcpg.plugin.config.v1+json \
            "${ZIP}:application/vnd.mcpg.plugin.package.v1+zip"
          # The floating `protocol-<major>-<os>-<arch>` tag lets a gateway pull
          # "the newest build that speaks protocol N for my platform" without
          # pinning a version, and it is the form our own documentation uses.
          # It is an `oras tag` of the manifest just pushed — same digest, so
          # it inherits that tag's signatures and adds no second artefact.
          proto="$(sed -n 's/^protocol_version:[[:space:]]*//p' plugin.yaml | head -1 | tr -d '"'"'"' ')"
          if [ -n "$proto" ]; then
            oras tag "$ref" "protocol-${proto%%.*}-${POS}-${PARCH}"
          else
            echo "::warning::no protocol_version in plugin.yaml — no floating protocol tag"
          fi

  # ── wasm artifact (plugin tier, runtime wasi-*) ──────────────────────
  # One wasm32-wasip2 component instead of the six-platform native matrix.
  # rustc emits a Component Model binary for this target, which is what
  # `runtime: wasi-v1` loads; pack/sign/push mirror the native leg with
  # os=wasi arch=wasm, so the gateway resolver's `-wasi-wasm` fallback
  # candidate resolves on the public channel.
  plugin-wasm-artifacts:
    if: inputs.tier == 'plugin' && needs.meta.outputs.publish == 'true' && vars.OSS_ARTIFACTS_PUBLISH == 'true' && needs.meta.outputs.wasm == 'true'
    needs: [meta, verify, github-release, lockfile]
    runs-on: ${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Mint sibling-fetch token (org App)
        id: fetch-token
        if: vars.OPERATOR_GITHUB_APPLICATION_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.OPERATOR_GITHUB_APPLICATION_ID }}
          private-key: ${{ secrets.OPERATOR_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Dependency access (private sibling mirrors)
        env:
          SIBLING_FETCH_TOKEN: ${{ steps.fetch-token.outputs.token || secrets.OSS_SIBLING_FETCH_TOKEN }}
        run: |
          if [ -n "${SIBLING_FETCH_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${SIBLING_FETCH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/".insteadOf "https://github.com/${GITHUB_REPOSITORY_OWNER}/"
          fi
      # The one resolved lockfile every lane builds against (--locked).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cargo-lock
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: wasm32-wasip2
      - name: Build component
        run: cargo build --release --locked --lib --target wasm32-wasip2
      - name: Install mcpg-plugin CLI (from its repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="https://github.com/${{ github.repository_owner }}/mcpg-plugin"
          tag=$(gh api "repos/${{ github.repository_owner }}/mcpg-plugin/releases?per_page=1" \
            --jq '.[0].tag_name // empty' 2>/dev/null || true)
          for attempt in 1 2 3; do
            if cargo install mcpg-plugin --git "$src" ${tag:+--tag "$tag"} --locked \
               || cargo install mcpg-plugin --git "$src" ${tag:+--tag "$tag"}; then
              exit 0
            fi
            sleep $(( attempt * 30 ))
          done
          echo "::error::could not install mcpg-plugin from ${src} ${tag:+@ ${tag}}"
          exit 1
      - name: Pack, sign, upload
        env:
          GH_TOKEN: ${{ github.token }}
          MCPG_PLUGIN_SIGNING_KEY: ${{ secrets.OSS_PLUGIN_SIGNING_KEY }}
          CRATE: ${{ needs.meta.outputs.crate }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          SHORT: ${{ inputs.plugin_short }}
        run: |
          set -euo pipefail
          crate_us=$(echo "$CRATE" | tr '-' '_')
          artifact="target/wasm32-wasip2/release/${crate_us}.wasm"
          [ -f "$artifact" ] || { echo "missing $artifact"; exit 1; }
          sign_args=()
          if [ -n "${MCPG_PLUGIN_SIGNING_KEY:-}" ]; then
            keyfile=$(mktemp)
            printf '%s' "$MCPG_PLUGIN_SIGNING_KEY" | base64 -d > "$keyfile"
            mcpg-plugin sign --key "$keyfile" "$artifact"
            rm -f "$keyfile"
            sign_args=(--signature "${artifact}.sig")
          else
            echo "::warning::OSS_PLUGIN_SIGNING_KEY unset — packaging without embedded Ed25519 signature"
          fi
          zip_name="mcpg-plugin-${SHORT}_${VERSION}_wasi_wasm.zip"
          mcpg-plugin pack --descriptor plugin.yaml --artifact "$artifact" "${sign_args[@]}" \
            --version "$VERSION" --os wasi --arch wasm --output "$zip_name" \
            --emit-config plugin-artifact-config.json
          shasum -a 256 "$zip_name" > "${zip_name}.sha256"
          gh release upload "$TAG" "$zip_name" "${zip_name}.sha256" --clobber
          echo "ZIP=$zip_name" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3.9.1
        with:
          cosign-release: 'v2.4.1'
      - name: Cosign bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          cosign sign-blob --yes --bundle "${ZIP}.sigstore.json" "$ZIP"
          gh release upload "$TAG" "${ZIP}.sigstore.json" --clobber
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-path: ${{ env.ZIP }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1
      - name: Publish OCI artifact
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SHORT: ${{ inputs.plugin_short }}
        run: |
          set -euo pipefail
          printf '%s' "${{ github.token }}" | \
            oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          ref="ghcr.io/${{ github.repository_owner }}/plugins/${SHORT}:${VERSION}-wasi-wasm"
          echo "pushing $ref"
          oras push "$ref" \
            --artifact-type "application/vnd.mcpg.plugin.v1" \
            --config plugin-artifact-config.json:application/vnd.mcpg.plugin.config.v1+json \
            "${ZIP}:application/vnd.mcpg.plugin.package.v1+zip"
          proto="$(sed -n 's/^protocol_version:[[:space:]]*//p' plugin.yaml | head -1 | tr -d '"'"'"' ')"
          if [ -n "$proto" ]; then
            oras tag "$ref" "protocol-${proto%%.*}-wasi-wasm"
          else
            echo "::warning::no protocol_version in plugin.yaml — no floating protocol tag"
          fi

  # ── container image (product tier, repos carrying a Dockerfile) ──────
  # Source-build Dockerfile on native runners per arch (a QEMU-emulated
  # rust build would take hours), then one manifest. Two explicit jobs —
  # matrix-job outputs are last-writer-wins, so a leg that doesn't set a
  # digest could clobber the one that did.
  image-amd64:
    if: inputs.tier == 'product' && inputs.has_image && needs.meta.outputs.publish == 'true' && vars.OSS_ARTIFACTS_PUBLISH == 'true'
    needs: [meta, verify, lockfile]
    runs-on: ${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      extra_digests: ${{ steps.push.outputs.extra_digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Stage the resolved lockfile into the build context so the image
      # compiles the same dependency graph as the binary lanes.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cargo-lock
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Private mirrors' Dockerfiles fetch PRIVATE sibling crates during
      # `cargo build`; the token rides a BuildKit secret (never a layer).
      # Minted from the org App per job; static token stays the fallback;
      # public repos define neither and the flag is simply not passed.
      - name: Mint sibling-fetch token (org App)
        id: fetch-token
        if: vars.OPERATOR_GITHUB_APPLICATION_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.OPERATOR_GITHUB_APPLICATION_ID }}
          private-key: ${{ secrets.OPERATOR_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - id: push
        env:
          CRATE: ${{ needs.meta.outputs.crate }}
          VERSION: ${{ needs.meta.outputs.version }}
          ARCH: amd64
          SIBLING_FETCH_TOKEN: ${{ steps.fetch-token.outputs.token || secrets.OSS_SIBLING_FETCH_TOKEN }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/${CRATE}"
          secret_args=()
          [ -n "${SIBLING_FETCH_TOKEN:-}" ] && secret_args=(--secret id=sibling_fetch_token,env=SIBLING_FETCH_TOKEN)
          docker buildx build --push \
            --platform "linux/${ARCH}" \
            --provenance mode=max --sbom true \
            "${secret_args[@]}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --metadata-file /tmp/meta.json \
            --tag "${repo}:${VERSION}-${ARCH}" .
          echo "digest=$(python3 -c "import json;print(json.load(open('/tmp/meta.json'))['containerimage.digest'])")" >> "$GITHUB_OUTPUT"
          # Variant images: same Dockerfile, one build target per pair,
          # published under its own package name. Layer cache is shared, so
          # each extra build reuses everything up to its final stage.
          extra=""
          IFS=',' read -ra pairs <<< "${{ inputs.extra_images }}"
          for pair in "${pairs[@]}"; do
            [ -n "$pair" ] || continue
            t="${pair%%=*}"; n="${pair#*=}"
            docker buildx build --push \
              --platform "linux/${ARCH}" \
              --provenance mode=max --sbom true \
              "${secret_args[@]}" \
              --target "$t" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --metadata-file /tmp/meta-extra.json \
              --tag "ghcr.io/${{ github.repository_owner }}/${n}:${VERSION}-${ARCH}" .
            d="$(python3 -c "import json;print(json.load(open('/tmp/meta-extra.json'))['containerimage.digest'])")"
            extra="${extra:+$extra }${n}=${d}"
          done
          echo "extra_digests=${extra}" >> "$GITHUB_OUTPUT"

  image-arm64:
    if: inputs.tier == 'product' && inputs.has_image && needs.meta.outputs.publish == 'true' && vars.OSS_ARTIFACTS_PUBLISH == 'true'
    needs: [meta, verify, lockfile]
    # Private repos build this leg under QEMU on the x86 self-hosted set —
    # slower than a native arm host, but off the paid-minutes budget. Public
    # repos keep the native hosted arm runner.
    runs-on: ${{ github.event.repository.private && 'lab-runners' || 'ubuntu-24.04-arm' }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      extra_digests: ${{ steps.push.outputs.extra_digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - if: ${{ github.event.repository.private }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
        with:
          platforms: arm64
      # Stage the resolved lockfile into the build context so the image
      # compiles the same dependency graph as the binary lanes.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cargo-lock
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Mint sibling-fetch token (org App)
        id: fetch-token
        if: vars.OPERATOR_GITHUB_APPLICATION_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.OPERATOR_GITHUB_APPLICATION_ID }}
          private-key: ${{ secrets.OPERATOR_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - id: push
        env:
          CRATE: ${{ needs.meta.outputs.crate }}
          VERSION: ${{ needs.meta.outputs.version }}
          ARCH: arm64
          SIBLING_FETCH_TOKEN: ${{ steps.fetch-token.outputs.token || secrets.OSS_SIBLING_FETCH_TOKEN }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/${CRATE}"
          secret_args=()
          [ -n "${SIBLING_FETCH_TOKEN:-}" ] && secret_args=(--secret id=sibling_fetch_token,env=SIBLING_FETCH_TOKEN)
          docker buildx build --push \
            --platform "linux/${ARCH}" \
            --provenance mode=max --sbom true \
            "${secret_args[@]}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --metadata-file /tmp/meta.json \
            --tag "${repo}:${VERSION}-${ARCH}" .
          echo "digest=$(python3 -c "import json;print(json.load(open('/tmp/meta.json'))['containerimage.digest'])")" >> "$GITHUB_OUTPUT"
          # Variant images: same Dockerfile, one build target per pair,
          # published under its own package name. Layer cache is shared, so
          # each extra build reuses everything up to its final stage.
          extra=""
          IFS=',' read -ra pairs <<< "${{ inputs.extra_images }}"
          for pair in "${pairs[@]}"; do
            [ -n "$pair" ] || continue
            t="${pair%%=*}"; n="${pair#*=}"
            docker buildx build --push \
              --platform "linux/${ARCH}" \
              --provenance mode=max --sbom true \
              "${secret_args[@]}" \
              --target "$t" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --metadata-file /tmp/meta-extra.json \
              --tag "ghcr.io/${{ github.repository_owner }}/${n}:${VERSION}-${ARCH}" .
            d="$(python3 -c "import json;print(json.load(open('/tmp/meta-extra.json'))['containerimage.digest'])")"
            extra="${extra:+$extra }${n}=${d}"
          done
          echo "extra_digests=${extra}" >> "$GITHUB_OUTPUT"

  image-manifest:
    if: inputs.tier == 'product' && inputs.has_image && needs.meta.outputs.publish == 'true' && vars.OSS_ARTIFACTS_PUBLISH == 'true'
    needs: [meta, image-amd64, image-arm64]
    runs-on: ${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3.9.1
        with:
          cosign-release: 'v2.4.1'
      - name: Merge per-arch images + sign by digest
        env:
          CRATE: ${{ needs.meta.outputs.crate }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/${CRATE}"
          docker buildx imagetools create -t "${repo}:${VERSION}" \
            "${repo}@${{ needs.image-amd64.outputs.digest }}" \
            "${repo}@${{ needs.image-arm64.outputs.digest }}"
          digest=$(docker buildx imagetools inspect "${repo}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes "${repo}@${digest}"
          # Variant images get the same merge+sign, per package name. The
          # per-arch jobs emit "name=digest" pairs; a name missing from
          # either arch is a hard error, not a single-arch index.
          amd="${{ needs.image-amd64.outputs.extra_digests }}"
          arm="${{ needs.image-arm64.outputs.extra_digests }}"
          for pair in $amd; do
            n="${pair%%=*}"; da="${pair#*=}"
            dr=""
            for p2 in $arm; do [ "${p2%%=*}" = "$n" ] && dr="${p2#*=}"; done
            if [ -z "$dr" ]; then
              echo "::error::variant image ${n}: amd64 digest present but no arm64 digest — refusing a single-arch index"
              exit 1
            fi
            vrepo="ghcr.io/${{ github.repository_owner }}/${n}"
            docker buildx imagetools create -t "${vrepo}:${VERSION}" \
              "${vrepo}@${da}" "${vrepo}@${dr}"
            vdigest=$(docker buildx imagetools inspect "${vrepo}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
            cosign sign --yes "${vrepo}@${vdigest}"
          done

  # ── SBOM + resolved-lock transparency (product tier) ─────────────────
  # ── public API diff — "what changed", without shipping a changelog ──────────
  # Releases deliberately ship no CHANGELOG.md: one written from upstream
  # commits would not be useful here. A machine-generated diff of the public
  # Rust API against the previous published version answers the same question
  # for a consumer, and cannot leak anything the crate does not already export.
  # Informational, so a crate rustdoc cannot process does not fail a release
  # that is otherwise complete.
  public-api-diff:
    if: inputs.tier != 'product' && needs.meta.outputs.publish == 'true'
    needs: [meta, verify, github-release]
    runs-on: ${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The baseline is the PREVIOUS release tag of this repo (crates are
          # git-referenced, so the repo's own tags are the publish history) —
          # the diff needs that ref present locally.
          fetch-depth: 0
          fetch-tags: true
      # rustdoc JSON is nightly-only, and it is what cargo-public-api reads.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: public-api
      - name: Resolve the previous release tag
        id: prev
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # Newest v* tag that is not this one. `sed 's/-/~/'` borrows
          # Debian's rule that `~` sorts before everything, which is what
          # makes `sort -V` agree with semver that v1.0.0-rc.1 precedes
          # v1.0.0 — without it the rc would be picked as the newer baseline.
          # `|| true`: on a first release there is no other tag, grep matches
          # nothing and exits 1, and under `set -e` that would fail the step
          # for every crate in the first wave — the one case this has to
          # handle gracefully.
          prev=$(git tag -l 'v*' | grep -vxF "$TAG" \
            | sed 's/-/~/' | sort -V | tail -1 | sed 's/~/-/' || true)
          echo "tag=${prev}" >> "$GITHUB_OUTPUT"
          echo "previous release tag: ${prev:-<none>}"
      - name: Diff the public API and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE: ${{ needs.meta.outputs.crate }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail
          out="${CRATE}-${VERSION}-public-api-diff.txt"
          if [ -z "$PREV" ]; then
            echo "First release of ${CRATE}; there is no earlier tag to diff against." > "$out"
          else
            {
              echo "Public API of ${CRATE} ${TAG} versus ${PREV}."
              echo "Generated by cargo-public-api; an empty diff means the public surface is unchanged."
              echo
            } > "$out"
            cargo install cargo-public-api --version 0.52.0 --locked
            if ! cargo public-api diff "${PREV}..${TAG}" >> "$out" 2>&1; then
              echo >> "$out"
              echo "(cargo-public-api could not complete for this crate; treat the diff as unavailable, not empty.)" >> "$out"
            fi
          fi
          gh release upload "$TAG" "$out" --clobber

  sbom:
    # Runs for every tier. A lib or plugin consumer has the same question a
    # product consumer does — what exactly went into this version — and the
    # answer costs one job. Products additionally carry binaries and images,
    # which is what OSS_ARTIFACTS_PUBLISH gates; the transparency assets are
    # not part of that gate.
    if: needs.meta.outputs.publish == 'true'
    needs: [meta, verify, github-release, lockfile]
    runs-on: ${{ github.event.repository.private && 'lab-runners' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cargo-lock
      - name: Attach the resolved lockfile + SPDX SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE: ${{ needs.meta.outputs.crate }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # The lockfile every lane built against, not a fresh resolution:
          # publishing a lockfile that described none of the shipped binaries
          # was worse than publishing nothing.
          cp Cargo.lock "${CRATE}-${VERSION}-resolved.Cargo.lock"
          # Pin the INSTALLER to the release tag, not `main`: this job holds
          # contents:write, so a moving upstream script must not execute here.
          curl -fsSL --retry 3 --retry-all-errors --max-time 120 \
            https://raw.githubusercontent.com/anchore/syft/v1.18.0/install.sh \
            | sh -s -- -b /usr/local/bin v1.18.0
          syft scan "dir:." -o "spdx-json=${CRATE}-${VERSION}.spdx.json"
          gh release upload "$TAG" \
            "${CRATE}-${VERSION}-resolved.Cargo.lock" \
            "${CRATE}-${VERSION}.spdx.json" --clobber
